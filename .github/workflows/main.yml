name: Android APK Build
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Buildozer and Cython
        run: pip install buildozer cython==0.29.33

      # -----------------------------------------------------
      # START OF CODE TO REPLACE
      # Replace the next two 'name: Install...' blocks with the single new block below
      # -----------------------------------------------------
      # - name: Install system dependencies (libtool)
      #   run: sudo apt-get update && sudo apt-get install -y libtool

      # - name: Install ncurses dependency
      #   run: sudo apt-get update && sudo apt-get install -y libncurses-dev
      # -----------------------------------------------------
      # END OF CODE TO REPLACE
      # -----------------------------------------------------
      
      # Use this single, new step to install all necessary dependencies
      - name: Install system dependencies (libtool, etc.)
        run: sudo apt-get update && sudo apt-get install -y libtool libltdl-dev libffi-dev libssl-dev python3-dev build-essential

      - name: Build Kivy App
        run: buildozer android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          
