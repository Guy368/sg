name: Android APK Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Use this single action to handle all dependencies and build
      - name: Build with Buildozer Action
        uses: ArtemSBulgakov/buildozer-action@v1 
        with:
          python-version: '3.10' 
      
      # The upload artifact step goes below here, after the new action
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.app
      - name: Build Kivy App
        run: buildozer android debug
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: APK-Build
          path: bin/*.apk
          
