name: Android APK Build
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Use a reliable setup action that handles NDK/SDK/Buildozer dependencies
      - name: Set up Kivy build environment
        uses: ullaakut/kivy-buildozer-action@v1
        with:
          python-version: '3.10'
          # This action automatically handles all system dependencies (libtool, etc)
      
      - name: Build Kivy App
        # This action runs buildozer automatically
        run: buildozer android debug
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          
