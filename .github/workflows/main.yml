name: Android APK Build
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PLACE THE NEW STEP HERE:
      - name: Install libtinfo5 dependency
        run: sudo apt-get update && sudo apt-get install -y libtinfo5
      
      # Use the correct, existing action that handles all dependencies
      - name: Build APK
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: '3.10'
          # This action handles all system dependencies automatically
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          
