name: Android APK Build
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # This is the location of the step that needs fixing
      - name: Install libtinfo5 dependency 
        run: sudo apt-get update && sudo apt-get install -y libtinfo5 # <-- Ensure 'run:' is here
      
      - name: Build APK
        uses: digreatbrian/buildozer-action@v2
        with:
          python-version: '3.10'
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          
